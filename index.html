<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>gothless</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" media="screen" href="https://fontlibrary.org//face/minecraftia" type="text/css"/>
<style>
:root{
  --bg:#050505; --panel:rgba(10,10,10,.82); --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.06);
  --ink:#f2f2f0; --ink-dim:#8f8f8b; --ink-faint:#4d4d4a; --mono:'JetBrains Mono', monospace; --serif:'Cormorant Garamond', serif;
  --ok:#6dffb3; --radius:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--mono); overflow-x:hidden; min-height:100vh; position:relative;}
body.glitching{animation:destroyGlitch .12s steps(2) infinite;}
@keyframes destroyGlitch{0%{transform:translate(0,0); filter:invert(0);}50%{transform:translate(-4px,3px); filter:invert(1) hue-rotate(180deg);}100%{transform:translate(3px,-2px); filter:invert(0);}}

#bgVideo{position:fixed; inset:0; z-index:-1; width:100%; height:100%; object-fit:cover; background:#050505;}
#field,#trailCanvas{position:fixed; inset:0; z-index:0; pointer-events:none;}
#trailCanvas{z-index:50;}
.vignette{position:fixed; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(ellipse 80% 60% at 50% 35%, rgba(255,255,255,.03), transparent 60%), radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.75) 100%);}
.noise{position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.03; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}

#boot{position:fixed; inset:0; z-index:100; background:#030303; display:flex; align-items:center; justify-content:center; flex-direction:column; transition:opacity .6s ease, visibility .6s ease;}
#boot.hide{opacity:0; visibility:hidden; pointer-events:none;}
#bootLine{font-size:.78rem; color:var(--ink-dim); letter-spacing:.02em; white-space:pre; min-height:1.4em; text-shadow:0 0 8px rgba(255,255,255,.15);}
#bootLine .cursor{display:inline-block; width:7px; height:1em; background:var(--ink-dim); margin-left:2px; animation:blink 1s steps(1) infinite; vertical-align:-2px;}
@keyframes blink{50%{opacity:0;}}
#bootBar{width:220px; height:1px; background:var(--line); margin-top:22px; position:relative; overflow:hidden;}
#bootBar i{position:absolute; inset:0; width:0%; background:#fff; box-shadow:0 0 8px #fff; transition:width .1s linear;}

#gate{position:fixed; inset:0; z-index:90; display:none; align-items:center; justify-content:center; flex-direction:column; background:var(--bg);}
#gate.show{display:flex;}
.gate-name{font-family:var(--mono); font-weight:300; font-size:1.3rem; letter-spacing:.5em; padding-left:.5em; color:#fff; opacity:0; animation:reveal 1.2s ease forwards; text-shadow:0 0 20px rgba(255,255,255,.5);}
.gate-rule{width:22px; height:1px; background:#fff; margin-top:16px; opacity:0; box-shadow:0 0 8px #fff; animation:reveal 1.2s ease .25s forwards, blink 1.1s steps(1) infinite .5s;}
@keyframes reveal{to{opacity:1;}}

#app{position:relative; z-index:5; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:34px 16px; opacity:0; transition:opacity .8s ease;}
#app.in{opacity:1;}
.stack{width:100%; max-width:430px; display:flex; flex-direction:column; gap:14px;}

.card,.term-card{
  width:100%; position:relative;
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.01) 30%, rgba(0,0,0,.2)), var(--panel);
  backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:0 40px 90px -25px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 40px rgba(255,255,255,.015);
  overflow:hidden; animation:cardIn .5s cubic-bezier(.16,1,.3,1) both;
}
@keyframes cardIn{from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:none;}}
.card::before,.term-card::before{content:''; position:absolute; top:0; left:0; right:0; height:70px; pointer-events:none; background:linear-gradient(180deg, rgba(255,255,255,.06), transparent);}
.term-card{
  display:none; position:fixed; z-index:70; width:min(92vw, 400px);
  box-shadow:0 50px 100px -20px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.06), inset 0 1px 0 rgba(255,255,255,.1);
}
.term-card.show{display:block; animation:cardIn .25s cubic-bezier(.16,1,.3,1) both;}

.tabs{display:flex; align-items:center; gap:2px; padding:14px 14px 12px; border-bottom:1px solid var(--line-soft); position:relative; z-index:2;}
.tab{background:none; border:none; color:var(--ink-faint); font-family:var(--mono); font-size:.72rem; letter-spacing:.06em; padding:6px 9px; cursor:pointer; position:relative; transition:color .25s ease;}
.tab:hover{color:var(--ink-dim);}
.tab.active{color:#fff; text-shadow:0 0 10px rgba(255,255,255,.4);}
.tab.active::after{content:''; position:absolute; left:9px; right:9px; bottom:-13px; height:1px; background:#fff; box-shadow:0 0 6px #fff; animation:underline .3s ease;}
@keyframes underline{from{transform:scaleX(0);} to{transform:scaleX(1);}}
.tab-spacer{flex:1;}
.meta-pill{display:flex; align-items:center; gap:5px; font-size:.66rem; color:var(--ink-dim); border:1px solid var(--line); border-radius:20px; padding:5px 10px; white-space:nowrap; background:rgba(255,255,255,.02);}
.help-btn{width:25px; height:25px; border-radius:7px; border:1px solid var(--line); background:rgba(255,255,255,.02); color:var(--ink-dim); font-family:var(--mono); font-size:.68rem; cursor:pointer; margin-left:6px; display:flex; align-items:center; justify-content:center; transition:all .2s ease;}
.help-btn:hover{color:#fff; border-color:rgba(255,255,255,.3); box-shadow:0 0 10px rgba(255,255,255,.15);}

.panels{position:relative; min-height:300px;}
.panel{padding:28px 22px 22px; display:none; animation:panelIn .35s ease both;}
.panel.active{display:block;}
@keyframes panelIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

.glitch-wrap{position:relative; margin-bottom:14px; display:inline-block;}
.glitch-name{font-family:'MinecraftiaRegular', var(--mono); font-weight:400; font-size:2.3rem; letter-spacing:.02em; margin:0; color:#fff; image-rendering:pixelated;
  text-shadow:0 0 2px rgba(255,255,255,.95), 0 0 14px rgba(255,255,255,.55), 0 0 46px rgba(255,255,255,.28), 0 0 90px rgba(255,255,255,.12);
  position:relative; display:inline-block;}
.glitch-name::before,.glitch-name::after{content:attr(data-text); position:absolute; left:0; top:0; width:100%; opacity:0;}
.glitch-name:hover::before{opacity:.8; color:#fff; transform:translate(-3px,0); clip-path:inset(0 0 55% 0); animation:glitchTop .4s steps(2,end) infinite;}
.glitch-name:hover::after{opacity:.6; color:#8f8f8b; transform:translate(3px,0); clip-path:inset(45% 0 0 0); animation:glitchBot .4s steps(2,end) infinite;}
@keyframes glitchTop{0%{transform:translate(-3px,-1px);}100%{transform:translate(3px,1px);}}
@keyframes glitchBot{0%{transform:translate(3px,1px);}100%{transform:translate(-3px,-1px);}}

.tagline{font-family:var(--serif); font-style:italic; font-weight:500; color:var(--ink-dim); font-size:1.08rem; margin:0 0 22px; line-height:1.4;}
.badges{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
.badge{border:1px solid var(--line); border-radius:7px; padding:4px 9px; font-size:.64rem; color:var(--ink-dim); display:flex; align-items:center; gap:4px; background:rgba(255,255,255,.02); transition:all .2s ease;}
.badge:hover{transform:translateY(-2px); border-color:rgba(255,255,255,.3); color:#fff; box-shadow:0 4px 14px rgba(255,255,255,.08);}
.identity-row{display:flex; align-items:center; gap:12px; padding:13px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.02);}
.avatar{width:40px; height:40px; border-radius:11px; background:#151515; position:relative; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-style:italic; color:var(--ink-dim); box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}
.status-dot{position:absolute; right:-2px; bottom:-2px; width:12px; height:12px; border-radius:50%; background:var(--ok); border:2px solid #0a0a0a; box-shadow:0 0 8px var(--ok);}
.status-dot.offline{background:var(--ink-faint); box-shadow:none;}
.id-text .handle{font-size:.86rem; color:#fff;}
.id-text .status-line{font-size:.68rem; color:var(--ink-faint); margin-top:2px;}

.project{border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; background:rgba(255,255,255,.015); transition:all .2s ease;}
.project:hover{border-color:rgba(255,255,255,.25); transform:translateX(2px); box-shadow:0 6px 20px rgba(0,0,0,.4);}
.project-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
.project-name{font-size:.88rem; color:#fff;}
.project-tag{font-size:.62rem; color:var(--ink-faint); border:1px solid var(--line); border-radius:5px; padding:2px 6px;}
.project-desc{font-size:.74rem; color:var(--ink-dim); margin-top:6px; line-height:1.5;}

.biolink{display:flex; align-items:center; gap:12px; padding:14px; border-radius:13px; margin-bottom:10px; text-decoration:none; color:#fff; position:relative; overflow:hidden; border:1px solid transparent; transition:transform .2s ease, box-shadow .2s ease;
  background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 38%, transparent), color-mix(in srgb, var(--accent) 6%, transparent) 60%, transparent), rgba(255,255,255,.02);
  border-color:color-mix(in srgb, var(--accent) 45%, transparent);
  box-shadow:0 8px 24px -8px color-mix(in srgb, var(--accent) 55%, transparent), inset 0 1px 0 rgba(255,255,255,.12);}
.biolink:hover{transform:translateX(3px) translateY(-1px); box-shadow:0 12px 30px -6px color-mix(in srgb, var(--accent) 65%, transparent), inset 0 1px 0 rgba(255,255,255,.16);}
.bl-icon{width:30px; height:30px; border-radius:8px; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; font-size:.8rem; flex-shrink:0; box-shadow:inset 0 1px 0 rgba(255,255,255,.25);}
.bl-text{min-width:0;}
.bl-text .bl-name{font-size:.84rem; display:flex; align-items:center; white-space:nowrap;}
.bl-text .bl-handle{font-size:.66rem; color:rgba(255,255,255,.65); margin-top:1px;}
.bl-actions{margin-left:auto; display:flex; align-items:center; gap:8px; flex-shrink:0;}
.bl-actions svg,.bl-actions span{color:rgba(255,255,255,.75);}
.verified{width:15px; height:15px; border-radius:50%; background:#fff; color:#000; font-size:.6rem; display:inline-flex; align-items:center; justify-content:center; margin-left:6px; flex-shrink:0; box-shadow:0 0 8px rgba(255,255,255,.6);}

.social-row{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line-soft); font-size:.8rem; color:var(--ink-dim); transition:color .2s ease, padding-left .2s ease;}
.social-row:last-child{border-bottom:none;}
.social-row:hover{color:#fff; padding-left:8px; text-shadow:0 0 10px rgba(255,255,255,.3);}
.social-row .icon{width:18px; text-align:center; color:var(--ink-faint); font-size:.95rem;}
.dm-note{text-align:center; font-size:.68rem; color:var(--ink-faint); margin:14px 0 2px; font-style:italic; font-family:var(--serif);}

/* audio card — inline, stacked below the main box, not floating */
.audio-card{padding:12px 14px; display:flex; align-items:center; gap:12px;}
.spotify-card{padding:0;}
.spotify-card iframe{display:block;}
.art{width:38px; height:38px; border-radius:9px; background:#151515; flex-shrink:0; overflow:hidden; display:flex; align-items:center; justify-content:center; font-size:.6rem; color:var(--ink-faint); box-shadow:inset 0 1px 0 rgba(255,255,255,.1);}
.audio-info{min-width:64px;}
.audio-title{font-size:.76rem; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.audio-artist{font-size:.66rem; color:var(--ink-faint);}
.track-count{font-size:.62rem; color:var(--ink-faint); white-space:nowrap;}
.transport{display:flex; align-items:center; gap:6px; flex-shrink:0;}
.transport button{width:26px; height:26px; border-radius:50%; border:1px solid var(--line); background:rgba(255,255,255,.03); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:.65rem; transition:all .2s ease;}
.transport button.main{width:30px; height:30px; box-shadow:0 0 12px rgba(255,255,255,.15);}
.transport button:hover{border-color:rgba(255,255,255,.4); box-shadow:0 0 10px rgba(255,255,255,.2);}
.eq{display:flex; align-items:flex-end; gap:2.5px; height:14px; flex-shrink:0;}
.eq span{width:2.5px; background:#fff; border-radius:1px; height:3px; box-shadow:0 0 4px #fff; transition:height .15s ease;}
.eq.playing span{animation:eqbar .8s ease-in-out infinite;}
.eq span:nth-child(1){animation-delay:0s;} .eq span:nth-child(2){animation-delay:.15s;} .eq span:nth-child(3){animation-delay:.3s;} .eq span:nth-child(4){animation-delay:.45s;}
@keyframes eqbar{0%,100%{height:3px;} 50%{height:14px;}}
.progress-wrap{flex:1; display:flex; flex-direction:column; gap:5px; min-width:0;}
.progress-track{height:3px; background:var(--line); border-radius:3px; position:relative; cursor:pointer;}
.progress-fill{position:absolute; left:0; top:0; height:100%; width:0%; background:#fff; border-radius:3px; box-shadow:0 0 8px rgba(255,255,255,.6);}
.progress-track .dots{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:5px;}
.progress-track .dots span{width:2px; height:2px; border-radius:50%; background:var(--ink-faint);}
.time-row{display:flex; justify-content:space-between; font-size:.6rem; color:var(--ink-faint);}

/* terminal (now inline, swaps with .card in the same slot) */
.term-head{display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line-soft); font-size:.75rem; color:var(--ink-dim); position:relative; z-index:2; cursor:move; touch-action:none; user-select:none;}
.term-head .thq{width:16px; height:16px; border-radius:50%; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:.6rem;}
.term-head .title{flex:1;}
.term-head button{background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:.85rem; padding:2px 6px;}
.term-head button:hover{color:#fff;}
.term-body{height:300px; overflow-y:auto; padding:14px; font-size:.74rem; line-height:1.6; color:var(--ink-dim); white-space:pre-wrap;}
.term-body .prompt{color:var(--ok); text-shadow:0 0 6px rgba(109,255,179,.5);}
.term-body .cmd-echo{color:#fff;}
.term-input-row{display:flex; align-items:center; gap:6px; padding:10px 12px; border-top:1px solid var(--line-soft); font-size:.74rem;}
.term-input-row .prompt{color:var(--ok); text-shadow:0 0 6px rgba(109,255,179,.5); flex-shrink:0;}
.term-input-row input{flex:1; background:none; border:none; outline:none; color:#fff; font-family:var(--mono); font-size:.74rem;}
.term-input-row input::placeholder{color:var(--ink-faint);}
.term-input-row input:disabled{opacity:.4;}
#snakeCanvas{display:block; margin:10px auto; background:#000; border:1px solid var(--line); border-radius:6px;}
.snake-score{text-align:center; font-size:.7rem; color:var(--ink-dim);}

#linkModal{position:fixed; inset:0; z-index:300; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(0,0,0,.65); backdrop-filter:blur(4px);}
#linkModal.show{display:flex;}
.link-modal-box{width:100%; max-width:340px; background:rgba(10,10,10,.92); backdrop-filter:blur(18px); border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:0 40px 80px rgba(0,0,0,.8); animation:cardIn .25s cubic-bezier(.16,1,.3,1) both;}
.link-modal-title{font-size:.85rem; color:#fff; text-shadow:0 0 10px rgba(255,255,255,.3); margin-bottom:8px;}
.link-modal-text{font-size:.76rem; color:var(--ink-dim); line-height:1.5; margin:0 0 18px; word-break:break-all;}
.link-modal-text span{color:#fff;}
.link-modal-actions{display:flex; gap:8px;}
.link-modal-actions button{flex:1; padding:9px 0; border-radius:8px; border:1px solid var(--line); background:rgba(255,255,255,.02); color:var(--ink-dim); font-family:var(--mono); font-size:.72rem; cursor:pointer; transition:all .2s ease;}
#linkModalGo{color:#fff; border-color:rgba(255,255,255,.3);}
.link-modal-actions button:hover{border-color:rgba(255,255,255,.4); color:#fff; box-shadow:0 0 10px rgba(255,255,255,.15);}

::selection{background:#fff; color:#000;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px;}
@media (max-width:420px){ .glitch-name{font-size:1.9rem;} }
</style>
</head>
<body>

<video id="bgVideo" autoplay loop playsinline></video>
<canvas id="field"></canvas>
<canvas id="trailCanvas"></canvas>
<div class="noise"></div>
<div class="vignette"></div>

<div id="boot">
  <div id="bootLine"><span class="cursor"></span></div>
  <div id="bootBar"><i></i></div>
</div>

<div id="gate">
  <div class="gate-name" id="gateName"></div>
  <div class="gate-rule"></div>
</div>

<div id="app">
  <div class="stack">

    <!-- tabbed card -->
    <div class="card" id="mainCard">
      <div class="tabs">
        <button class="tab active" data-tab="home">home</button>
        <button class="tab" data-tab="projects">projects</button>
        <button class="tab" data-tab="biolinks">biolinks</button>
        <button class="tab" data-tab="socials">socials</button>
        <div class="tab-spacer"></div>
        <div class="meta-pill">👁 <span id="viewCount">—</span></div>
        <button class="help-btn" id="helpBtn" title="open terminal">?</button>
      </div>
      <div class="panels">
        <div class="panel active" data-panel="home">
          <div class="glitch-wrap"><h1 class="glitch-name" id="homeName" data-text="gothless">gothless</h1></div>
          <p class="tagline" id="homeTagline">building things that shouldn't feel warm.</p>
          <div class="badges" id="badgeRow"></div>
          <div class="identity-row">
            <div class="avatar">g<span class="status-dot" id="statusDot"></span></div>
            <div class="id-text"><div class="handle" id="idHandle">@gothless</div><div class="status-line" id="idStatus">status unknown</div></div>
          </div>
        </div>
        <div class="panel" data-panel="projects"><div id="projectList"></div><p class="dm-note" style="margin-top:0;">not atm</p></div>
        <div class="panel" data-panel="biolinks"><div id="biolinkList"></div><p class="dm-note" id="dmNote">want your own biolink added here? shoot me a dm :)</p></div>
        <div class="panel" data-panel="socials"><div id="socialList"></div><p class="dm-note" style="margin-top:0;">not atm</p></div>
      </div>
    </div>

    <!-- terminal card: same slot, swapped in on "?" -->
    <div class="term-card" id="termCard">
      <div class="term-head">
        <div class="thq">?</div>
        <div class="title">terminal</div>
        <button id="termMin" title="minimize">–</button>
        <button id="termClose" title="close">×</button>
      </div>
      <div class="term-body" id="termBody"></div>
      <div class="term-input-row">
        <span class="prompt">root@127.0.0.1~$</span>
        <input id="termInput" type="text" placeholder="type a command..." autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
    </div>

    <!-- spotify embed: swap the src track id in CONFIG.spotifyTrackId to change songs -->
    <div class="card spotify-card">
      <iframe id="spotifyFrame" style="border-radius:16px;" width="100%" height="80" frameborder="0"
        allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

  </div>
</div>

<div id="linkModal">
  <div class="link-modal-box">
    <div class="link-modal-title">leaving gothless</div>
    <p class="link-modal-text">you're about to visit <span id="linkModalUrl"></span></p>
    <div class="link-modal-actions">
      <button id="linkModalCancel">cancel</button>
      <button id="linkModalGo">continue</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG — everything customizable lives here.
   Placeholder link names are generic on purpose — swap in your
   real ones; the color glow is derived automatically from `accent`.
   ============================================================ */
const CONFIG = {
  name: "gothless",
  handle: "@gothless",
  tagline: "building things that shouldn't feel warm.",
  badges: [ { label: "S03", title: "member since S3" }, { label: "◐", title: "night owl" }, { label: "◈", title: "verified builder" } ],
  discord: { userId: "786539308826755120", fallbackStatus: "status unknown" },
  projects: [
    { name: "seventyfour", tag: "studio", desc: "3D visualization studio — product renders, motion, and client work." },
    { name: "this site", tag: "web", desc: "single-file, config-driven bio-link. no build step, no backend required." }
  ],
  biolinks: [
    { name: "fakecrime.bio", handle: "@gothless", url: "https://fakecrime.bio/gothless", verified: true,  accent: "#ec4899", icon: "⌘" },
    { name: "halo.rip",      handle: "@shit",     url: "https://halo.rip/shit",           verified: false, accent: "#dc2626", icon: "◒" },

/* ============================================================
   DISCORD PRESENCE — live status/activity via Lanyard, live
   badges/clan-tag/decoration via dstn.to. Falls back to the
   static CONFIG.badges / CONFIG.discord.fallbackStatus if either
   API is unreachable or CONFIG.discord.userId is empty.
   ============================================================ */
const STATUS_COLORS = { online:'#43b581', idle:'#faa61a', dnd:'#f04747', offline:'#747f8d' };
const ACTIVITY_VERB = ['playing','streaming','listening to','watching'];

function renderOfflinePresence(){
  document.getElementById('idStatus').textContent = CONFIG.discord.fallbackStatus;
  document.getElementById('statusDot').classList.add('offline');
  badgeRow.innerHTML='';
}

async function loadDiscordPresence(){
  const id = CONFIG.discord.userId;
  if(!id){ renderOfflinePresence(); return; }

  const [lanyardRes, dstnRes] = await Promise.allSettled([
    fetch(`https://api.lanyard.rest/v1/users/${id}`).then(r=>r.json()),
    fetch(`https://dstn.to/api/users/${id}`).then(r=>r.json())
  ]);
  const lanyard = (lanyardRes.status==='fulfilled' && lanyardRes.value && lanyardRes.value.success) ? lanyardRes.value.data : null;
  const dstn = (dstnRes.status==='fulfilled') ? dstnRes.value : null;
  const du = (lanyard && lanyard.discord_user) || (dstn && dstn.user) || null;

  if(!du){ renderOfflinePresence(); return; }

  /* avatar + decoration */
  const avatarEl = document.querySelector('.avatar');
  const isGif = du.avatar && du.avatar.startsWith('a_');
  const avatarUrl = du.avatar
    ? `https://cdn.discordapp.com/avatars/${id}/${du.avatar}.${isGif?'gif':'png'}?size=128`
    : `https://cdn.discordapp.com/embed/avatars/0.png`;
  avatarEl.innerHTML = `<img src="${avatarUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:11px;" onerror="this.style.display='none'"><span class="status-dot" id="statusDot"></span>`;
  const deco = du.avatar_decoration_data;
  if(deco && deco.asset){
    avatarEl.insertAdjacentHTML('afterbegin', `<img src="https://cdn.discordapp.com/avatar-decoration-presets/${deco.asset}.png" style="position:absolute;inset:-5px;width:calc(100% + 10px);height:calc(100% + 10px);pointer-events:none;" onerror="this.remove()">`);
  }

  /* name */
  const displayName = du.global_name || du.display_name || du.username;
  document.getElementById('idHandle').textContent = displayName ? `${displayName} (@${du.username})` : CONFIG.handle;

  /* status dot + line */
  const status = lanyard ? lanyard.discord_status : 'offline';
  const dot = document.getElementById('statusDot');
  dot.classList.toggle('offline', status==='offline');
  dot.style.background = STATUS_COLORS[status] || STATUS_COLORS.offline;
  dot.style.boxShadow = status==='offline' ? 'none' : `0 0 8px ${STATUS_COLORS[status]}`;

  let statusLine = status || CONFIG.discord.fallbackStatus;
  if(lanyard && Array.isArray(lanyard.activities) && lanyard.activities.length){
    const custom = lanyard.activities.find(a=>a.type===4);
    const rich = lanyard.activities.find(a=>a.type!==4);
    if(custom && custom.state) statusLine = custom.state;
    else if(rich) statusLine = `${ACTIVITY_VERB[rich.type] || 'doing'} ${rich.name}`;
  }
  document.getElementById('idStatus').textContent = statusLine;

  /* badges — live from dstn.to: badge icons + clan/primary_guild tag */
  badgeRow.innerHTML='';
  const dUser = dstn && dstn.user;
  if(dUser && Array.isArray(dUser.badges)){
    dUser.badges.forEach(b=>{
      const el=document.createElement('div'); el.className='badge'; el.title=b.description||b.id;
      el.innerHTML=`<img src="https://cdn.discordapp.com/badge-icons/${b.icon}.png?size=24" style="width:14px;height:14px;" onerror="this.parentElement.remove()">`;
      badgeRow.appendChild(el);
    });
  }
  const clan = dUser && (dUser.primary_guild || dUser.clan);
  if(clan && clan.identity_enabled && clan.tag){
    const el=document.createElement('div'); el.className='badge'; el.title='server tag';
    el.innerHTML=`<img src="https://cdn.discordapp.com/clan-badges/${clan.identity_guild_id}/${clan.badge}.png?size=16" style="width:12px;height:12px;" onerror="this.style.display='none'"><span>${clan.tag}</span>`;
    badgeRow.appendChild(el);
  }
}

const mainCard=document.getElementById('mainCard'), termCard=document.getElementById('termCard'), termBody=document.getElementById('termBody'),
      termInput=document.getElementById('termInput'), helpBtn=document.getElementById('helpBtn');

let mode='normal';      // 'normal' | 'captcha' | 'snake'
let captchaAnswer=null;
let trailOn=false;

function printLine(html){const div=document.createElement('div'); div.innerHTML=html; termBody.appendChild(div); termBody.scrollTop=termBody.scrollHeight;}

/* position the terminal popped out above the bio card, centered over it */
function positionTermDefault(){

}

function openTerm(){

  setTimeout(()=>termInput.focus(),50);

function closeTerm(){ termCard.classList.remove('show'); exitSnake(); }

/* ---- drag the terminal window by its header ---- */
(function(){
  const head=document.querySelector('.term-head');
  let dragging=false, offX=0, offY=0;
  head.addEventListener('pointerdown',(e)=>{
    if(e.target.closest('button')) return;
    dragging=true;
    const rect=termCard.getBoundingClientRect();
    offX=e.clientX-rect.left; offY=e.clientY-rect.top;
    head.setPointerCapture(e.pointerId);
  });
  head.addEventListener('pointermove',(e)=>{
    if(!dragging) return;
    let x=e.clientX-offX, y=e.clientY-offY;
    x=Math.max(4, Math.min(window.innerWidth-termCard.offsetWidth-4, x));
    y=Math.max(4, Math.min(window.innerHeight-44, y));
    termCard.style.left=x+'px'; termCard.style.top=y+'px';
  });
  head.addEventListener('pointerup', ()=>{ dragging=false; });
  head.addEventListener('pointercancel', ()=>{ dragging=false; });
})();

const COMMANDS={
  help:()=>["Available commands:","- ping","- clear","- close","- minimize","- echo [text]","- snake","- destroy","- captcha","- trail"].join('\n'),
  ping:()=>`pong — ${Math.floor(Math.random()*40+8)}ms`,
  clear:()=>{ termBody.innerHTML=''; return null; },
  close:()=>{ closeTerm(); return null; },
  minimize:()=>{ closeTerm(); return null; },
  snake:()=>{ startSnake(); return null; },
  destroy:()=>{ doDestroy(); return null; },
  captcha:()=>{ startCaptcha(); return null; },
  trail:()=>{ trailOn=!trailOn; return trailOn ? 'cursor trail: enabled' : 'cursor trail: disabled'; },
};

function doDestroy(){
  printLine('initiating self-destruct sequence...');
  document.body.classList.add('glitching');
  termInput.disabled=true;
  setTimeout(()=>{
    document.body.classList.remove('glitching');

function startCaptcha(){
  const a=Math.floor(Math.random()*9+1), b=Math.floor(Math.random()*9+1);
  captchaAnswer=a+b; mode='captcha';
  printLine(`verify you're human — what is ${a} + ${b}?`);
  termInput.placeholder='answer...';
}
function resolveCaptcha(raw){
  const ok = parseInt(raw,10)===captchaAnswer;
  printLine(ok ? 'human verified ✓' : `incorrect — it was ${captchaAnswer}. bot detected (jk)`);
  mode='normal'; termInput.placeholder='type a command...';
}

/* ---- snake, playable inside the terminal body ---- */
let snakeState=null;
function startSnake(){
  mode='snake';
  termInput.disabled=true; termInput.placeholder='esc to quit';
  printLine('SNAKE — arrow keys to move, esc to quit');
  const canvas=document.createElement('canvas');
  canvas.id='snakeCanvas'; canvas.width=220; canvas.height=220;
  termBody.appendChild(canvas);
  const scoreEl=document.createElement('div'); scoreEl.className='snake-score'; scoreEl.textContent='score: 0';
  termBody.appendChild(scoreEl);
  termBody.scrollTop=termBody.scrollHeight;

  const ctx=canvas.getContext('2d'), cell=11, cols=20, rows=20;
  let snake=[{x:10,y:10}], dir={x:1,y:0}, nextDir={x:1,y:0}, food=spawnFood(), score=0, alive=true;
  function spawnFood(){ return {x:Math.floor(Math.random()*cols), y:Math.floor(Math.random()*rows)}; }
  function draw(){
    ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#fff'; ctx.shadowBlur=6; ctx.shadowColor='#fff';
    snake.forEach(s=>ctx.fillRect(s.x*cell,s.y*cell,cell-1,cell-1));
    ctx.fillStyle='#6dffb3'; ctx.shadowColor='#6dffb3';
    ctx.fillRect(food.x*cell,food.y*cell,cell-1,cell-1);
    ctx.shadowBlur=0;
  }
  function step(){
    if(!alive) return;
    dir=nextDir;
    const head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if(head.x<0||head.x>=cols||head.y<0||head.y>=rows||snake.some(s=>s.x===head.x&&s.y===head.y)){
      alive=false; printLine(`game over — score: ${score}`); exitSnake(); return;
    }
    snake.unshift(head);
    if(head.x===food.x && head.y===food.y){ score++; scoreEl.textContent='score: '+score; food=spawnFood(); }
    else snake.pop();
    draw();
  }
  draw();
  const iv=setInterval(step, 120);
  function onKey(e){
    if(e.key==='Escape'){ printLine('snake terminated.'); exitSnake(); return; }
    const map={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
    if(map[e.key]){ e.preventDefault();
      const nd=map[e.key];
      if(!(nd.x===-dir.x && nd.y===-dir.y)) nextDir=nd;
    }
  }
  document.addEventListener('keydown', onKey);
  snakeState={ iv, onKey };
}
function exitSnake(){
  if(snakeState){ clearInterval(snakeState.iv); document.removeEventListener('keydown', snakeState.onKey); snakeState=null; }
  if(mode==='snake') mode='normal';
  termInput.disabled=false; termInput.placeholder='type a command...';
  if(document.activeElement!==termInput) termInput.focus();
}

termInput.addEventListener('keydown',(e)=>{
  if(e.key!=='Enter') return;
  const raw=termInput.value.trim();
  if(mode==='snake') return;
  if(!raw) return;
  printLine(`<span class="prompt">root@127.0.0.1~$</span> <span class="cmd-echo">${raw.replace(/</g,'&lt;')}</span>`);
  termInput.value='';
  if(mode==='captcha'){ resolveCaptcha(raw); return; }
  const [cmd,...rest]=raw.split(' ');
  if(cmd==='echo'){ printLine(rest.join(' ')||''); }
  else if(COMMANDS[cmd]){ const out=COMMANDS[cmd](); if(out) printLine(out.replace(/\n/g,'<br>')); }
  else { printLine(`command not found: ${cmd}`); }
});

/* ---------- ambient field: orbit arcs + glowing dots ---------- */
(function(){
  const canvas=document.getElementById('field'), ctx=canvas.getContext('2d');
  let w,h,dots,arcs;
  function resize(){w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight;}
  function init(){ resize();
    arcs=Array.from({length:4},()=>({cx:w*(0.2+Math.random()*0.6), cy:h*(0.1+Math.random()*0.8), r:Math.max(w,h)*(0.5+Math.random()*0.6), rot:Math.random()*Math.PI*2}));
    dots=Array.from({length:22},()=>({x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.4+0.4, vx:(Math.random()-0.5)*0.05, vy:(Math.random()-0.5)*0.05, a:Math.random()*0.5+0.15, glow:Math.random()<0.15}));
  }
  function tick(){
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle='rgba(255,255,255,.05)'; ctx.lineWidth=1;
    arcs.forEach(a=>{ctx.beginPath(); ctx.ellipse(a.cx,a.cy,a.r,a.r*0.4,a.rot,0,Math.PI*2); ctx.stroke();});
    dots.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<0)p.x=w; if(p.x>w)p.x=0; if(p.y<0)p.y=h; if(p.y>h)p.y=0;
      ctx.beginPath();
      if(p.glow){ctx.shadowBlur=14; ctx.shadowColor='rgba(255,255,255,.8)';} else {ctx.shadowBlur=0;}
      ctx.arc(p.x,p.y,p.glow?p.r*2.2:p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${p.a})`; ctx.fill();
    });
    ctx.shadowBlur=0;
    requestAnimationFrame(tick);
  }
  window.addEventListener('resize', resize); init(); tick();
})();

/* ---------- cursor trail (toggled by "trail" command) ---------- */
(function(){
  const canvas=document.getElementById('trailCanvas'), ctx=canvas.getContext('2d');
  let w,h,points=[];
  function resize(){w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight;}
  window.addEventListener('resize', resize); resize();
  window.addEventListener('mousemove',(e)=>{ if(trailOn) points.push({x:e.clientX,y:e.clientY,life:1}); });
  window.addEventListener('touchmove',(e)=>{ if(trailOn && e.touches[0]) points.push({x:e.touches[0].clientX,y:e.touches[0].clientY,life:1}); });
  function tick(){
    ctx.clearRect(0,0,w,h);
    points.forEach(p=>{
      ctx.beginPath(); ctx.arc(p.x,p.y,3*p.life,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${p.life*0.6})`; ctx.shadowBlur=8; ctx.shadowColor='#fff'; ctx.fill();
      p.life-=0.03;
    });
    points=points.filter(p=>p.life>0);
    ctx.shadowBlur=0;
    requestAnimationFrame(tick);
  }
  tick();
})();
